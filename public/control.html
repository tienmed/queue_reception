<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Điều Khiển Gọi Số - QueueReception</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <main class="control-layout">
    <section class="control-main">
      <header class="main-header">
        <h1>Hệ Thống Gọi Số Thông Minh</h1>
        <div class="status-indicator">Trực Tuyến</div>
      </header>

      <div class="viewer-emulator">
        <h2 id="activeStreamLabel">Phòng Khám BHYT</h2>
        <div class="big-number" id="currentNumber">000</div>
        <div class="viewer-hint">SỐ HIỆN TẠI</div>
      </div>

      <div class="primary-actions">
        <button class="btn-mega btn-primary" id="incrementButton">
          <i data-lucide="user-plus" class="icon-lg"></i>
          <span class="text">Gọi Số Tiếp Theo</span>
        </button>
        <button class="btn-mega btn-outline" id="announceButton">
          <i data-lucide="megaphone" class="icon-lg"></i>
          <span class="text">Phát Loa Gọi Số</span>
        </button>
      </div>
    </section>

    <aside class="control-config">
      <div class="config-scroll-area">
        <div class="panel">
          <h3>Luồng Phục Vụ</h3>
          <div class="segment-control" id="streamTabs"></div>
        </div>

        <div class="panel">
          <h3>Thiết Lập Thông Báo</h3>
          <div class="field">
            <label>Mẫu câu gọi số ({{number}}, {{quay}})</label>
            <textarea id="announcementTemplate" rows="3" placeholder="Xin mời số {{number}} đến {{quay}}..."></textarea>
            <div class="preview" id="previewText">Xem trước: ...</div>
            <button class="btn-save" id="saveTemplateBtn">Cập Nhật Mẫu</button>
          </div>
        </div>

        <div class="panel">
          <h3>Giọng Nói & Âm Thanh</h3>
          <div class="field-row">
            <div class="field">
              <label>Giọng đọc</label>
              <select id="voiceSelect">
                <option value="Bích Ngọc (Nữ - Miền Bắc)">Bích Ngọc (Bắc)</option>
                <option value="Xuân Vĩnh (Nam - Miền Nam)">Xuân Vĩnh (Nam)</option>
              </select>
            </div>
            <div class="field">
              <label>Tốc độ</label>
              <input type="range" min="0.5" max="2" step="0.1" value="1" id="speedRange" class="slider" />
            </div>
          </div>
          <div class="field">
            <label>Hiệu chỉnh số thủ công</label>
            <div class="inline-input">
              <input type="number" id="setNumberInput" min="0" value="0" />
              <button id="setNumberBtn">Đặt Lại</button>
            </div>
          </div>
        </div>

        <div class="panel highlight">
          <h3>Thông Báo Tùy Chỉnh</h3>
          <div class="field">
            <textarea id="customText" rows="2" placeholder="Nhập nội dung thông báo khẩn cấp..."></textarea>
            <button class="btn-custom" id="customAnnounceButton">Phát Thông Báo</button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
  <script src="/control.js"></script>
</body>

</html>
