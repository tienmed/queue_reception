<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Điều Khiển Gọi Số - QueueReception</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <main class="control-layout">
    <section class="control-main">
      <header class="main-header">
        <div class="brand">
          <i data-lucide="layers" class="icon-brand"></i>
          <h1>QueueControl <span>Pro</span></h1>
        </div>
        <div class="status-indicator">Hệ thống sẵn sàng</div>
      </header>

      <div class="viewer-emulator">
        <div class="emulator-content">
          <h2 id="activeStreamLabel">---</h2>
          <p id="activeCounterLabel">---</p>
          <div class="big-number" id="currentNumber">000</div>
        </div>
        <div class="emulator-footer">
          <span>ĐANG PHỤC VỤ</span>
        </div>
      </div>

      <div class="control-grid">
        <div class="action-card main-call">
          <div class="action-buttons">
            <button class="btn-action btn-decrement" id="decrementButton" title="Gọi số trước (-1)">
              <i data-lucide="chevron-left"></i>
            </button>
            <button class="btn-action btn-increment" id="incrementButton">
              <i data-lucide="user-plus"></i>
              <span>GỌI SỐ TIẾP THEO</span>
            </button>
          </div>
        </div>

        <button class="btn-secondary" id="announceButton">
          <i data-lucide="megaphone"></i>
          <span>Gọi lại số này</span>
        </button>
      </div>
    </section>

    <aside class="control-sidebar">
      <div class="sidebar-content">
        <div class="config-group">
          <h3><i data-lucide="route"></i> LUỒNG PHỤC VỤ</h3>
          <div class="tab-list" id="streamTabs"></div>
        </div>

        <div class="config-group">
          <h3><i data-lucide="monitor"></i> QUẦY PHỤC VỤ</h3>
          <div class="tab-list" id="counterTabs"></div>
        </div>

        <div class="config-group">
          <h3><i data-lucide="mic"></i> GIỌNG ĐỌC</h3>
          <div class="select-wrapper">
            <select id="voiceSelect">
              <option value="bich_ngoc">Bích Ngọc (Nữ - Bắc)</option>
              <option value="pham_tuyen">Phạm Tuyên (Nam - Bắc)</option>
              <option value="thuc_doan">Thục Đoan (Nữ - Nam)</option>
              <option value="xuan_vinh">Xuân Vĩnh (Nam - Nam)</option>
            </select>
          </div>
        </div>

        <div class="config-group">
          <h3><i data-lucide="settings-2"></i> ĐẶT LẠI SỐ</h3>
          <div class="manual-input">
            <input type="number" id="setNumberInput" min="0" value="0" />
            <button id="setNumberBtn">CẬP NHẬT</button>
          </div>
        </div>

        <div class="config-group system-announce">
          <h3><i data-lucide="bell"></i> THÔNG BÁO HỆ THỐNG</h3>
          <button class="btn-secondary btn-full" id="announceStartButton">
            <i data-lucide="play-circle"></i>
            <span>PHÁT THÔNG BÁO ĐẦU CA</span>
          </button>
        </div>

        <div class="config-group custom-announce">
          <h3><i data-lucide="message-square"></i> THÔNG BÁO TÙY CHỈNH</h3>
          <div class="custom-input">
            <textarea id="customText" rows="2" placeholder="Nhập nội dung thông báo..."></textarea>
            <button class="btn-custom" id="customAnnounceButton">Phát Thông Báo</button>
          </div>
        </div>
      </div>


      <div class="sidebar-footer">
        <p>&copy; 2026 QueueReception Dashboard</p>
      </div>
    </aside>
  </main>


  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
  <script src="/control.js"></script>
</body>

</html>
